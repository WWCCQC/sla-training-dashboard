<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SLA Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2744 0%, #1e3a5f 50%, #0f2744 100%);
            min-height: 100vh;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>

<body class="flex items-center justify-center px-4">
    <div class="login-card rounded-2xl p-8 w-full max-w-md animate-in">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-500 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-chart-line text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">SLA Dashboard</h1>
            <p class="text-blue-300 text-sm mt-1">Admin Panel Login</p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div
            class="bg-red-500/20 border border-red-500/40 text-red-300 px-4 py-3 rounded-lg mb-6 flex items-center text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>
            {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/admin/login">
            <div class="mb-5">
                <label class="text-blue-200 text-sm mb-2 block font-medium">
                    <i class="fas fa-user mr-1"></i> ชื่อผู้ใช้
                </label>
                <input type="text" name="username" required autocomplete="username"
                    class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-blue-300/50 outline-none"
                    placeholder="กรอกชื่อผู้ใช้">
            </div>
            <div class="mb-6">
                <label class="text-blue-200 text-sm mb-2 block font-medium">
                    <i class="fas fa-lock mr-1"></i> รหัสผ่าน
                </label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-blue-300/50 outline-none"
                    placeholder="กรอกรหัสผ่าน">
            </div>
            <button type="submit" class="btn-login w-full py-3 rounded-lg text-white font-semibold text-base">
                <i class="fas fa-sign-in-alt mr-2"></i> เข้าสู่ระบบ
            </button>
        </form>

        <!-- Back Link -->
        <div class="text-center mt-6">
            <a href="/" class="text-blue-300 hover:text-blue-200 text-sm transition">
                <i class="fas fa-arrow-left mr-1"></i> กลับหน้าหลัก
            </a>
        </div>
    </div>
</body>

</html>
